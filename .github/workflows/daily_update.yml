name: Day-ahead forecast and actuals

on:
  schedule:
    # 03:37, 04:37, 05:37 Istanbul: leave room for delayed GitHub runners
    # while preserving the 12:00 issuance cutoff.
    - cron: '37 0,1,2 * * *'
    # 15:47 and 21:47 Istanbul: actuals and historical gap recovery only.
    - cron: '47 12,18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Worker operation
        type: choice
        options: [all, forecast, actuals]
        default: all

permissions:
  contents: read

concurrency:
  group: forecast-worker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build reproducible worker
        run: docker build -t grid-forecast .
      - name: Run worker
        env:
          EPIAS_USERNAME: ${{ secrets.EPIAS_USERNAME }}
          EPIAS_PASSWORD: ${{ secrets.EPIAS_PASSWORD }}
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          REQUESTED_MODE: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          test -n "$DATABASE_URL" || { echo "Missing persistent database secret"; exit 1; }
          mode="${REQUESTED_MODE:-forecast}"
          if [ -n "$SCHEDULE" ]; then
            case "$SCHEDULE" in
              "37 0,1,2 * * *") mode=forecast ;;
              "47 12,18 * * *") mode=actuals ;;
              *) echo "Unsupported schedule: $SCHEDULE"; exit 1 ;;
            esac
          fi
          docker run --rm -e EPIAS_USERNAME -e EPIAS_PASSWORD -e DATABASE_URL \
            grid-forecast python scripts/daily_run.py --mode "$mode" --lookback-days 365
