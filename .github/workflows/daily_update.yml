name: Day-ahead forecast and actuals

on:
  schedule:
    # 09:15, 10:15, 11:15 Istanbul: retry before the 12:00 project cutoff.
    - cron: '15 6-8 * * *'
    # Separate actuals recovery, including retries after provider delays.
    - cron: '15 12,18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Worker operation
        type: choice
        options: [all, forecast, actuals]
        default: all

permissions:
  contents: read

concurrency:
  group: forecast-worker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build reproducible worker
        run: docker build -t grid-forecast .
      - name: Run worker
        env:
          EPIAS_USERNAME: ${{ secrets.EPIAS_USERNAME }}
          EPIAS_PASSWORD: ${{ secrets.EPIAS_PASSWORD }}
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          REQUESTED_MODE: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          test -n "$DATABASE_URL" || { echo "Missing persistent database secret"; exit 1; }
          mode="${REQUESTED_MODE:-all}"
          if [ "$SCHEDULE" = "15 12,18 * * *" ]; then mode=actuals; fi
          docker run --rm -e EPIAS_USERNAME -e EPIAS_PASSWORD -e DATABASE_URL \
            grid-forecast python scripts/daily_run.py --mode "$mode" --lookback-days 365
