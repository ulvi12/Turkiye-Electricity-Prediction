x-runtime: &runtime
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: ${DATABASE_URL:-${SUPABASE_DB_URL:-sqlite:////data/forecast.db}}
  volumes:
    - forecast-data:/data

services:
  api:
    <<: *runtime
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5
    restart: unless-stopped

  dashboard:
    build: .
    environment:
      API_BASE_URL: http://api:8000
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  worker:
    <<: *runtime
    profiles: ["jobs"]
    command: ["python", "scripts/daily_run.py"]

volumes:
  forecast-data:
